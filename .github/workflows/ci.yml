name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SENTRY_AUTH_TOKEN is what switches on source-map upload (see
      # apps/web/vite.config.ts) — absent on forks and unset repos, where the
      # build simply skips it and emits no maps at all. Uploaded here rather
      # than from either deploy job so the one artifact both Dev and
      # Production ship stays byte-identical; frames resolve by debug ID, not
      # by release.
      - name: Build
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WEB }}

      - name: Upload frontend build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 90

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  deploy-backend:
    name: Deploy backend (Railway, development)
    needs: [lint, format, typecheck, build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: |
          n=0
          until [ "$n" -ge 3 ]; do
            npm install -g @railway/cli && break
            n=$((n + 1))
            echo "npm install failed (attempt $n/3), retrying in 5s..."
            sleep 5
          done
          if [ "$n" -ge 3 ]; then
            echo "npm install failed after 3 attempts"
            exit 1
          fi

      - name: Deploy to Railway
        run: railway up --service "$RAILWAY_SERVICE_ID" --environment development --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEVELOPMENT }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}

  deploy-frontend:
    name: Deploy frontend (Cloudflare Pages, development)
    needs: [lint, format, typecheck, build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download frontend build artifact
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

      - name: Write runtime env
        working-directory: apps/web
        run: |
          node -e '
            const fs = require("fs");
            const env = {
              API_URL: "https://api-dev.anagrabble.com",
              WS_URL: "wss://api-dev.anagrabble.com",
              CLERK_PUBLISHABLE_KEY: process.env.CLERK_PUBLISHABLE_KEY,
              SENTRY_DSN: process.env.SENTRY_DSN,
              SENTRY_ENVIRONMENT: "development",
              RELEASE: process.env.GITHUB_SHA,
            };
            fs.writeFileSync("dist/env.js", `window.__ENV__ = ${JSON.stringify(env, null, 2)};\n`);
          '
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_DEV }}
          # A DSN is a write-only, publicly-embeddable key — a repo variable,
          # not a secret, since it ends up in env.js on the CDN either way.
          SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB_DEV }}

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Pages (dev alias)
        working-directory: apps/web
        run: wrangler pages deploy dist --project-name=anagrabble --branch=dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
