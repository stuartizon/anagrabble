name: Deploy to production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend-production:
    name: Deploy backend (Railway, production)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: |
          n=0
          until [ "$n" -ge 3 ]; do
            npm install -g @railway/cli && break
            n=$((n + 1))
            echo "npm install failed (attempt $n/3), retrying in 5s..."
            sleep 5
          done
          if [ "$n" -ge 3 ]; then
            echo "npm install failed after 3 attempts"
            exit 1
          fi

      - name: Deploy to Railway
        run: railway up --service "$RAILWAY_SERVICE_ID" --environment production --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

  deploy-frontend-production:
    name: Deploy frontend (Cloudflare Pages, production)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @anagrabble/web build

      - name: Write runtime env
        working-directory: apps/web
        run: |
          node -e '
            const fs = require("fs");
            const env = {
              API_URL: "https://api.anagrabble.com",
              WS_URL: "wss://api.anagrabble.com",
              CLERK_PUBLISHABLE_KEY: process.env.CLERK_PUBLISHABLE_KEY,
            };
            fs.writeFileSync("dist/env.js", `window.__ENV__ = ${JSON.stringify(env, null, 2)};\n`);
          '
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_PROD }}

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Pages (production alias)
        working-directory: apps/web
        run: wrangler pages deploy dist --project-name=anagrabble --branch=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
