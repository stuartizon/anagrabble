name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI run ID to promote (defaults to the latest successful CI run on main)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy-backend-production:
    name: Deploy backend (Railway, production)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: |
          n=0
          until [ "$n" -ge 3 ]; do
            npm install -g @railway/cli && break
            n=$((n + 1))
            echo "npm install failed (attempt $n/3), retrying in 5s..."
            sleep 5
          done
          if [ "$n" -ge 3 ]; then
            echo "npm install failed after 3 attempts"
            exit 1
          fi

      - name: Deploy to Railway
        run: railway up --service "$RAILWAY_SERVICE_ID" --environment production --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}

  deploy-frontend-production:
    name: Deploy frontend (Cloudflare Pages, production)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve CI run to promote
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="${{ inputs.ci_run_id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          if [ -z "$run_id" ] || [ "$run_id" == "null" ]; then
            echo "::error::No successful CI run found on main to promote (or the specified ci_run_id was invalid)"
            exit 1
          fi
          # The commit the artifact was actually built from — not
          # github.sha, which is whatever main points at when someone
          # happens to click "Run workflow". Reported as the Sentry release
          # so a production error names the deploy that introduced it.
          head_sha=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq '.head_sha')
          echo "Promoting frontend build from CI run $run_id (commit $head_sha)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Download frontend build artifact
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Write runtime env
        working-directory: apps/web
        run: |
          node -e '
            const fs = require("fs");
            const env = {
              API_URL: "https://api.anagrabble.com",
              WS_URL: "wss://api.anagrabble.com",
              CLERK_PUBLISHABLE_KEY: process.env.CLERK_PUBLISHABLE_KEY,
              SENTRY_DSN: process.env.SENTRY_DSN,
              SENTRY_ENVIRONMENT: "production",
              RELEASE: process.env.RELEASE,
            };
            fs.writeFileSync("dist/env.js", `window.__ENV__ = ${JSON.stringify(env, null, 2)};\n`);
          '
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY_PROD }}
          # Deliberately the same variable ci.yml uses for Dev: one project,
          # one DSN, separated by the environment tag above rather than by a
          # second project or a second key — see docs/decisions.md "Error
          # tracking: Sentry behind a reportError wrapper".
          SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
          RELEASE: ${{ steps.resolve.outputs.head_sha }}

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Pages (production alias)
        working-directory: apps/web
        run: wrangler pages deploy dist --project-name=anagrabble --branch=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
