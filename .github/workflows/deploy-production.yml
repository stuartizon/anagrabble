name: Deploy to production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend-production:
    name: Deploy backend (Railway, production)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: |
          n=0
          until [ "$n" -ge 3 ]; do
            npm install -g @railway/cli && break
            n=$((n + 1))
            echo "npm install failed (attempt $n/3), retrying in 5s..."
            sleep 5
          done
          if [ "$n" -ge 3 ]; then
            echo "npm install failed after 3 attempts"
            exit 1
          fi

      - name: Deploy to Railway
        run: railway up --service "$RAILWAY_SERVICE_ID" --environment production --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

  deploy-frontend-production:
    name: Deploy frontend (Vercel production)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
