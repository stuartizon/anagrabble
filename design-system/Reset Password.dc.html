<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/anagrabble-design-system-57868138-ffc0-4189-b22f-9ab59d0b1b0d/tokens/colors.css">
  <link rel="stylesheet" href="_ds/anagrabble-design-system-57868138-ffc0-4189-b22f-9ab59d0b1b0d/tokens/semantic.css">
  <link rel="stylesheet" href="_ds/anagrabble-design-system-57868138-ffc0-4189-b22f-9ab59d0b1b0d/tokens/typography.css">
  <link rel="stylesheet" href="_ds/anagrabble-design-system-57868138-ffc0-4189-b22f-9ab59d0b1b0d/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/anagrabble-design-system-57868138-ffc0-4189-b22f-9ab59d0b1b0d/tokens/radius.css">
  <link rel="stylesheet" href="_ds/anagrabble-design-system-57868138-ffc0-4189-b22f-9ab59d0b1b0d/tokens/shadows.css">
  <link rel="stylesheet" href="_ds/anagrabble-design-system-57868138-ffc0-4189-b22f-9ab59d0b1b0d/styles.css">
  <script src="_ds/anagrabble-design-system-57868138-ffc0-4189-b22f-9ab59d0b1b0d/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--paper); }
    * { box-sizing: border-box; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-dark); }
  </style>
</helmet>

<div style="min-height:100vh;background:var(--paper);font-family:var(--font-body);display:flex;flex-direction:column">

  <header style="padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface-card)">
    <a href="Home.dc.html"><x-import component-from-global-scope="AnagrabbleDesignSystem_578681.Wordmark" size="md" hint-size="140px,24px"></x-import></a>
  </header>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px">
    <div style="width:100%;max-width:380px">
      <x-import component-from-global-scope="AnagrabbleDesignSystem_578681.Card" hint-size="380px,320px">

        <sc-if value="{{ isDone }}">
          <div style="font-family:var(--font-display);font-weight:700;font-size:var(--text-lg);color:var(--ink);margin-bottom:6px">Password reset.</div>
          <div style="font-family:var(--font-body);font-size:var(--text-sm);color:var(--text-secondary);margin-bottom:20px">You can log in with your new password now.</div>
          <a href="Log in, Sign up.dc.html"><x-import component-from-global-scope="AnagrabbleDesignSystem_578681.Button" size="lg" hint-size="100%,48px">Back to log in</x-import></a>
        </sc-if>

        <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
          <div style="font-family:var(--font-display);font-weight:700;font-size:var(--text-lg);color:var(--ink);margin-bottom:6px">Choose a new password</div>
          <div style="font-family:var(--font-body);font-size:var(--text-sm);color:var(--text-secondary);margin-bottom:20px">{{ subtitle }}</div>
          <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:14px">
            <x-import component-from-global-scope="AnagrabbleDesignSystem_578681.Input" label="New password" placeholder="••••••••" value="{{ password }}" onChange="{{ onPasswordChange }}" error="{{ formError }}" hint-size="100%,64px"></x-import>
            <x-import component-from-global-scope="AnagrabbleDesignSystem_578681.Input" label="Confirm new password" placeholder="••••••••" value="{{ confirmPassword }}" onChange="{{ onConfirmChange }}" hint-size="100%,64px"></x-import>
            <div style="margin-top:6px">
              <x-import component-from-global-scope="AnagrabbleDesignSystem_578681.Button" type="submit" size="lg" hint-size="100%,48px">Reset password</x-import>
            </div>
          </form>
        </sc-if>

      </x-import>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { password: '', confirmPassword: '', formError: '', done: false };

  componentDidMount() {
    const params = new URLSearchParams(window.location.search);
    this.email = params.get('email') || 'your account';
  }

  onPasswordChange = (e) => this.setState({ password: e.target.value });
  onConfirmChange = (e) => this.setState({ confirmPassword: e.target.value });

  submit = (e) => {
    e.preventDefault();
    const { password, confirmPassword } = this.state;
    if (!password.trim()) { this.setState({ formError: 'Required' }); return; }
    if (password !== confirmPassword) { this.setState({ formError: "Passwords don't match" }); return; }
    this.setState({ done: true, formError: '' });
  };

  renderVals() {
    const { password, confirmPassword, formError, done } = this.state;
    return {
      isDone: done, isForm: !done,
      subtitle: `Resetting the password for ${this.email}.`,
      password, confirmPassword, formError,
      onPasswordChange: this.onPasswordChange, onConfirmChange: this.onConfirmChange,
      submit: this.submit,
    };
  }
}

</script>
</body>
</html>
