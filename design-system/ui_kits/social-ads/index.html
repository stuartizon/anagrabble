<!-- @dsCard group="Social ads" viewport="1280x640" name="Social ad templates" subtitle="Square + story ad layouts" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Anagrabble — Social ads</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;background:var(--surface-sunken);padding:32px;font-family:var(--font-body)}.gallery{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}.frame{transform:scale(.42);transform-origin:top left}.wrap-a,.wrap-b{width:454px;height:454px;overflow:hidden;border-radius:8px;box-shadow:var(--shadow-md)}.wrap-c{width:454px;height:807px;overflow:hidden;border-radius:8px;box-shadow:var(--shadow-md)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Wordmark, LetterTile, Button } = window.AnagrabbleDesignSystem_578681;

function SquareAdWord(){
  return (
    <div className="frame" style={{width:1080,height:1080,background:'var(--paper)',display:'flex',flexDirection:'column',justifyContent:'space-between',padding:64,boxSizing:'border-box'}}>
      <Wordmark size="lg" />
      <div style={{display:'flex',gap:16}}>{['C','A','S','T'].map(l=><LetterTile key={l} letter={l} size="lg" />)}</div>
      <div>
        <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:72,lineHeight:1.05,color:'var(--ink)',marginBottom:24}}>Steal a<br/>word.</div>
        <Button size="lg">Play now</Button>
      </div>
    </div>
  );
}

function SquareAdAccent(){
  return (
    <div className="frame" style={{width:1080,height:1080,background:'var(--accent)',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'flex-start',padding:64,boxSizing:'border-box'}}>
      <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:64,lineHeight:1.1,color:'#fff',marginBottom:28}}>CAT becomes<br/>CAST becomes<br/>SCAT.</div>
      <div style={{fontFamily:'var(--font-body)',fontSize:28,color:'rgba(255,255,255,0.85)',marginBottom:40,maxWidth:640}}>A word game about building on what everyone else already played.</div>
      <Wordmark size="lg" color="#fff" />
    </div>
  );
}

function StoryAd(){
  return (
    <div className="frame" style={{width:1080,height:1920,background:'var(--paper)',display:'flex',flexDirection:'column',justifyContent:'space-between',padding:64,boxSizing:'border-box'}}>
      <Wordmark size="lg" />
      <div style={{display:'flex',flexDirection:'column',gap:16,alignItems:'flex-start'}}>
        <div style={{display:'flex',gap:14}}>{['T','A','R'].map(l=><LetterTile key={l} letter={l} size="lg" />)}</div>
        <div style={{display:'flex',gap:14}}>{['S','T','A','R','T'].map((l,i)=><LetterTile key={i} letter={l} size="lg" highlight={i>=3} />)}</div>
      </div>
      <div>
        <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:68,lineHeight:1.08,color:'var(--ink)',marginBottom:28}}>Add a letter.<br/>Steal the word.</div>
        <Button size="lg">Play now</Button>
      </div>
    </div>
  );
}

function Gallery(){
  return (
    <div className="gallery">
      <div className="wrap-a"><SquareAdWord/></div>
      <div className="wrap-b"><SquareAdAccent/></div>
      <div className="wrap-c"><StoryAd/></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Gallery/>);
</script>
</body>
</html>
